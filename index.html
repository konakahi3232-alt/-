<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>食品ロスカードゲーム</title><style>
:root{--bg:#fff9ef;--card:#fff;--line:#eadfce;--accent:#e8895b;--ok:#4f9b72;--bad:#c85f5f;--text:#3e3a36}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}.wrap{max-width:1050px;margin:auto;padding:22px}.title{text-align:center;font-size:30px;font-weight:800;margin:8px}.sub{text-align:center;color:#777;margin-bottom:18px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 4px 16px #00000008;margin-bottom:16px}input,button,select{font:inherit}input{padding:12px;border:1px solid #d9ccb9;border-radius:10px;width:100%;margin:6px 0}button{border:0;border-radius:11px;padding:11px 15px;background:var(--accent);color:white;font-weight:700;cursor:pointer;margin:4px}button.secondary{background:#7b8d98}button.green{background:var(--ok)}button:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.status{padding:10px 12px;border-radius:10px;background:#f5f1e9;margin:8px 0}.ok{background:#eaf6ef;color:#2d724e}.err{background:#fff0f0;color:#a64040}.players{display:flex;gap:8px;flex-wrap:wrap}.player{padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:#fffaf5}.player.turn{outline:3px solid #f2c58e}.hand{display:flex;gap:9px;flex-wrap:wrap}.card{width:112px;min-height:128px;border:1px solid var(--line);border-radius:15px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center}.card .emoji{font-size:38px}.card b{font-size:17px}.recipe{display:grid;grid-template-columns:1fr auto;align-items:center;border:1px solid var(--line);border-radius:12px;padding:9px;margin:6px 0;background:#fff}.recipe.selected{outline:3px solid #f1bb7c}.need{color:#777;font-size:13px}.score{font-weight:800}.hidden{display:none}.small{font-size:13px;color:#777}.log{max-height:210px;overflow:auto;background:#faf8f4;border-radius:10px;padding:10px}.log div{padding:4px;border-bottom:1px solid #eee}.room{font-size:28px;font-weight:900;letter-spacing:3px}.center{text-align:center}@media(max-width:760px){.grid{grid-template-columns:1fr}.card{width:92px;min-height:112px}.title{font-size:24px}}
</style></head><body><main class="wrap"><div class="title">🍚 食品ロスカードゲーム</div><div class="sub">材料を集めて料理を作ろう！ 食材を無駄にしないことがポイント。</div>
<section id="lobby" class="panel"><h2>ゲームに参加</h2><input id="name" placeholder="名前を入力"><div class="row"><button onclick="createRoom()">ルームを作る</button><button class="secondary" onclick="joinRoom()">参加する</button></div><input id="code" placeholder="参加するルームID（例：A1B2C3）" style="text-transform:uppercase"><div id="status" class="status">サーバーに接続しています…</div><div class="small">同じURLを友達に送って、ルームIDを共有してください。</div></section>
<section id="game" class="hidden"><div class="panel"><div>ルームID</div><div class="room" id="roomCode"></div><div class="row"><button onclick="copyCode()">ルームIDをコピー</button><button id="startBtn" class="green" onclick="startGame()">ゲーム開始</button></div><div id="gameStatus" class="status">友達を待っています。</div></div>
<div class="grid"><div><div class="panel"><h2>プレイヤー</h2><div id="players" class="players"></div></div><div class="panel"><h2>あなたの手札</h2><div id="hand" class="hand"></div><div class="row" style="margin-top:10px"><button id="drawBtn" onclick="drawCard()">カードを引く</button><button id="discardBtn" class="secondary" onclick="discardSelected()">選択カードを捨てる</button></div></div></div>
<div><div class="panel"><h2>料理</h2><div id="recipes"></div><button id="cookBtn" class="green" onclick="cook()">選んだ料理を作る</button></div><div class="panel"><h2>ゲームログ</h2><div id="log" class="log"></div></div></div></div></section></main>
<script>
const ING={egg:['卵','🥚'],sugar:['砂糖','🍬'],soy:['しょうゆ','🧴'],rice:['米','🍚'],tomato:['トマト','🍅'],oil:['油','🫗'],beef:['牛肉','🥩'],onion:['たまねぎ','🧅'],pork:['豚肉','🥓'],chicken:['鶏肉','🍗'],lettuce:['レタス','🥬'],bread:['パン','🍞'],cheese:['チーズ','🧀'],potato:['じゃがいも','🥔'],carrot:['にんじん','🥕'],fish:['魚','🐟'],butter:['バター','🧈']};
const REC=[['卵焼き',['egg','sugar','soy'],3],['オムライス',['egg','rice','tomato'],3],['チャーハン',['rice','egg','oil'],3],['牛丼',['beef','rice','onion'],3],['豚丼',['pork','rice','onion'],3],['親子丼',['egg','chicken','onion'],3],['肉じゃが',['beef','potato','carrot'],3],['カレー',['beef','potato','carrot'],3],['ポークソテー',['pork','oil','soy'],3],['野菜炒め',['carrot','onion','oil'],3],['トマトサラダ',['tomato','lettuce','oil'],3],['チーズサンド',['bread','cheese','lettuce'],3],['ハンバーガー',['bread','beef','lettuce'],3],['ピザトースト',['bread','cheese','tomato'],3],['ポテトサラダ',['potato','egg','carrot'],3],['ステーキ',['beef','oil','soy'],3],['目玉焼き',['egg','oil'],3],['塩むすび',['rice'],3],['フライドポテト',['potato','oil'],3],['トースト',['bread','butter'],3],['ゆで卵',['egg'],3],['たまごかけご飯',['egg','rice'],3],['チーズポテト',['potato','cheese'],3],['刺身',['fish'],3],['サンドイッチ',['bread','lettuce'],3]];
let ws,me='',code='',state=null,selectedHand=-1,selectedRecipe=-1,host=false;
function $(x){return document.getElementById(x)}
function setStatus(t,kind=''){const e=$('status');e.textContent=t;e.className='status '+kind}
function connect(){const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}/ws`);ws.onopen=()=>setStatus('サーバーに接続しました。','ok');ws.onclose=()=>setStatus('サーバーとの接続が切れました。ページを再読み込みしてください。','err');ws.onerror=()=>setStatus('サーバーに接続できません。','err');ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='error'){setStatus(d.message,'err');if($('game').classList.contains('hidden')===false)$('gameStatus').textContent=d.message;return}if(d.type==='joined'){code=d.code;me=d.me;host=d.host;$('lobby').classList.add('hidden');$('game').classList.remove('hidden');$('roomCode').textContent=code;$('startBtn').classList.toggle('hidden',!host);render()}if(d.type==='state'){state=d.state;render()}}}
function send(type,extra={}){if(!ws||ws.readyState!==1)return setStatus('サーバーに接続できていません。','err');ws.send(JSON.stringify({type,code,me,...extra}))}
function createRoom(){const n=$('name').value.trim();if(!n)return setStatus('名前を入力してください。','err');sendRaw({type:'create',name:n})}
function joinRoom(){const n=$('name').value.trim(),c=$('code').value.trim().toUpperCase();if(!n)return setStatus('名前を入力してください。','err');if(!c)return setStatus('ルームIDを入力してください。','err');sendRaw({type:'join',name:n,code:c})}
function sendRaw(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));else setStatus('サーバーに接続中です。少し待ってからもう一度押してください。','err')}
function startGame(){send('start')}
function drawCard(){send('draw')}
function discardSelected(){if(selectedHand<0)return $('gameStatus').textContent='捨てるカードを選んでください。';send('discard',{index:selectedHand});selectedHand=-1}
function cook(){if(selectedRecipe<0)return;$('gameStatus').textContent='料理を作っています…';send('cook',{recipe:selectedRecipe});selectedRecipe=-1}
function copyCode(){navigator.clipboard?.writeText(code);$('gameStatus').textContent='ルームIDをコピーしました！'}
function hasNeed(hand,need){const c={};hand.forEach(x=>c[x]=(c[x]||0)+1);const r={};need.forEach(x=>r[x]=(r[x]||0)+1);return Object.keys(r).every(x=>(c[x]||0)>=r[x])}
function render(){if(!state)return;const mep=state.players.find(p=>p.id===me);if(!mep)return;$('players').innerHTML=state.players.map(p=>`<div class="player ${p.id===state.turn?'turn':''}"><b>${esc(p.name)}</b><br><span class="score">${p.score}点</span>${p.id===state.turn?' 🎯':''}</div>`).join('');$('hand').innerHTML=mep.hand.map((k,i)=>`<div class="card ${selectedHand===i?'selected':''}" onclick="selectedHand=${i};render()"><div class="emoji">${ING[k][1]}</div><b>${ING[k][0]}</b><div class="small">${i+1}番</div></div>`).join('');$('recipes').innerHTML=REC.map((r,i)=>`<div class="recipe ${selectedRecipe===i?'selected':''}" onclick="selectedRecipe=${i};render()"><div><b>${r[0]}</b><div class="need">${r[1].map(k=>ING[k][1]+ING[k][0]).join('・')}</div></div><b>${r[2]}点</b></div>`).join('');$('log').innerHTML=state.log.map(x=>`<div>${esc(x)}</div>`).join('');const myTurn=state.turn===me;$('gameStatus').textContent=state.started?(myTurn?'あなたのターンです。':'他のプレイヤーのターンです。'):'ホストがゲームを開始するのを待っています。';$('drawBtn').disabled=!state.started||!myTurn||mep.hand.length>=4;$('discardBtn').disabled=!state.started||!myTurn||selectedHand<0;$('cookBtn').disabled=!state.started||!myTurn||selectedRecipe<0||!hasNeed(mep.hand,REC[selectedRecipe]?.[1]||[])}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
connect();
</script></body></html>
